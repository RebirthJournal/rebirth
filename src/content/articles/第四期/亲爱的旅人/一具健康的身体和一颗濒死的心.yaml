title: 一具健康的身体和一颗濒死的心
author: 王伊憬
subtitle: ""
heading: []
hideHeading: false
entry: ""
hideEntry: false
poem: true
body: |+
  
  ![](/img/Links/Jane Zhang一具健康的身体.jpeg)
  {:.caption.bottom.right.inside caption="张静妍 Jane Zhang"}

  用触碰 拥抱 亲吻 一封送别信 
  用浸满夕阳的操场和总是满员的秋千 
  用生命有机体的眼神交流 
  用好久不见的喧闹和不顾一切的最后一天 
  用最后一句眼含热泪的再见
  换来平静的呼吸 平均的心跳 平稳的生命体征 

  用一具健康的身体
  换来一颗濒死的心


