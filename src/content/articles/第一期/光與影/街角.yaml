title: 街角
author: 张艺凡
subtitle: ""
heading: []
hideHeading: false
entry: ""
hideEntry: false
poem: true
body: |

  午睡的风 打了个哈欠
  调色盘翻落在梧桐的叶间
  我看见
  橙色的鲸
  游过电线杆
  棉白色的树影 星星点点
  穿着棉麻衬衫的摆渡人划着小舟
  行过厚厚的积雪与枯枝
  时而远 时而近
  镜中 我与黎明前的黄昏一同苏醒

