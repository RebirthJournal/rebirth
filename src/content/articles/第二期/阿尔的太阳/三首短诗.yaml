body: |
  
  # **孤独**
  {:.pl-5}

  黑暗的垂钓者
  在夜晚中
  拾起鱼框，穿过月亮
  双手握住水
  {:.pl-5.font-smaller}

  孤独的
  水
  {:.pl-5.font-smaller}

  烈火的太阳
  融化了水
  融化了木
  高高的 在你的手心中
  融化了我的双耳

  我生活在山谷中
  你栖息在海洋里
  你翻身拨了拨水
  我伸手拂了拂月
  {:.pl-5}
